services:
  backend:
    image: rln24/habit-bloom-backend:latest
    env_file:
      - .env
    environment:
      PORT: 3001
      DATABASE_PATH: /app/data/habit-bloom.db
      APP_TIMEZONE: America/La_Paz
    volumes:
      - habit_bloom_data:/app/data
    restart: unless-stopped

  frontend:
    image: rln24/habit-bloom-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  habit_bloom_data:
